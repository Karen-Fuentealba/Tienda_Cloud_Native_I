name: CI/CD Tienda Perritos - Backend

on:
 # push:
 #   branches: [ "main" ]
 #   paths:
 #     - "backend/**"
 #     - ".github/workflows/cicd-tienda-backend.yml"
  workflow_dispatch:

jobs:
  deploy-backend-ec2:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Copiar archivos backend a EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST_BACKEND_DB }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "backend/*"
        target: "/home/ubuntu/tienda-backend"

    - name: Limpiar y desplegar backend en EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST_BACKEND_DB }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          #  Eliminar solo el contenedor e imagen del backend
          sudo docker stop tienda-backend || true
          sudo docker rm tienda-backend || true
          sudo docker rmi tienda-backend:latest || true

          #  Instalar Docker si no está
          sudo apt-get update -y
          sudo apt-get install -y docker.io

          #  Construir imagen desde Dockerfile
          cd /home/ubuntu/tienda-backend
          sudo docker build -t tienda-backend .

          #  Levantar contenedor nuevo
           sudo docker run -d --restart unless-stopped --name tienda-backend -p 3001:3001 \
            -e AAD_TENANT_ID=${{ secrets.INTERNAL_TENANT_ID }} \
            -e AAD_AUDIENCE=${{ secrets.AAD_AUDIENCE }} \
            tienda-backend:latest
