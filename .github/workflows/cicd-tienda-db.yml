name: CI/CD Tienda Perritos - DB

on:
  workflow_dispatch:

jobs:
  deploy-db-ec2:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Copiar archivos DB a EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST_BACKEND_DB }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "db/*"
        target: "/home/ubuntu/tienda-db/"

    - name: Limpiar y desplegar DB en EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST_BACKEND_DB }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          # Eliminar solo el contenedor e imagen de la DB
          sudo docker stop tienda-db || true
          sudo docker rm tienda-db || true
          sudo docker rmi tienda-db:latest || true

          # Construir imagen MySQL desde Dockerfile
          cd /home/ubuntu/tienda-db/db
          sudo docker build -t tienda-db .
          
          # Crear red si no existe
          sudo docker network create tienda-net || true
          
          # Levantar contenedor de la base de datos
          sudo docker run -d --restart unless-stopped --name tienda-db --network tienda-net -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            -e MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }} \
            -e MYSQL_USER=${{ secrets.MYSQL_USER }} \
            -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
            tienda-db:latest



